<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NIGHTMIX · 本机分轨</title><link rel="stylesheet" href="/static/style.css"><body><header><a href="/">Ⅲ NIGHTMIX <small>STEM LAB</small></a><span class="badge">● MAC 本机处理</span></header><main><section class="hero"><p class="eyebrow">YOUR MUSIC. FOUR LAYERS.</p><h1>找到音乐。<br>拆开每一层声音<span>。</span></h1><p>电脑分轨，iPad 打碟。</p></section><section class="panel"><nav><button class="active" data-tab="search">搜歌下载</button><button data-tab="upload">导入音频</button><button data-tab="link">粘贴链接</button></nav><form id="search" class="tab"><label>歌名 / 歌手</label><div class="row"><input id="query" placeholder="例如 Kendrick Lamar DNA" required maxlength="200"><button class="primary">搜索</button></div><small>YouTube 搜索 · 先确认版本，再下载 MP3</small></form><form id="upload" class="tab" hidden><label class="drop">＋ 选择电脑上的音频<input id="file" type="file" accept="audio/*,.m4a,.flac,.mp3,.wav" required><small>MP3 / M4A / WAV / FLAC · 最大 500 MB</small></label><button class="primary">导入音频</button></form><form id="link" class="tab" hidden><label>音频 / 视频页面链接</label><div class="row"><input id="url" type="url" placeholder="https://…" required><button class="primary">下载 MP3</button></div><small>使用 yt-dlp 支持的平台；不保证付费、DRM 或受限内容可用。</small></form><p id="notice" role="status"></p><div id="results"></div></section><section class="workspace"><div class="section-head"><h2>工作区</h2><span>音频与结果保存在这台电脑</span></div><div id="jobs"></div></section><footer>分轨完成 → 下载四轨 ZIP → AirDrop 到 iPad 并解压 → DJ 台「分轨」中对应导入四个 WAV。<br>分离使用本机 Demucs，首次下载模型需要联网；不调用 GPT，不消耗 API Token。在线下载仅用于你有权获取的内容。</footer></main><script>window.LOCAL_TOKEN='__TOKEN__'</script><script src="/static/app.js"></script></body></html>
